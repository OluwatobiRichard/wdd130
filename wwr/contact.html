<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="Get in touch with our team to learn more about our exciting whitewater rafting adventures, guided river tours, and booking options.">
    <meta name="author" content="Oluwatobi Ojo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo1.png" alt="Logo image">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="campany-info">
            <h1>White Water Rafting Company</h1>
            <p>Address: 123 Main River street</p>
            <p>State: Kolo, California</p>
            <p>Phone No: +1-999-999-9999</p>
            <p>Email: info@whitewater.com</p>
        </div>
        <section class="map-info">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d44481.81044469725!2d3.9405179912251596!3d7.376953949374898!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sGoogle%20ibadan!5e0!3m2!1sen!2sng!4v1781507846885!5m2!1sen!2sng"
                  width="450" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form action="submit">
                <div class="form-item column2">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Name">
                </div>
                <div class="form-item column2">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Email">
                </div>
                <fieldset class="column2">
                    <h4>Message Purpose</h4>
                    <div>
                        <div>
                            <input type="radio" id="general" name="Purpose" value="general-inquiry">
                            <label for="general">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservation" name="Purpose"
                              value="reservation-question">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="suggestion" name="Purpose"
                              value="website-suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </fieldset>
                <div class="form-item column1">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>
                <div class="form-item column1">
                    <input type="checkbox" id="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthy newsletter</label>
                </div>
                <button class="button">Get in Torch!</button>
            </form>
        </section>
        <section class="adventures">
            <h2>We Are Here to Serve You</h2>
            <div class="adventure-gallery">
                <figure>
                    <img src="images/john-smith.jpg" alt="John Smith, General Manager">
                    <figcaption>
                        <strong>John Smith</strong><br>
                        General Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/sarah-jones.jpg" alt="Sarah Johnson, Lead River Guide">
                    <figcaption>
                        <strong>Sarah Johnson</strong><br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/michael-brown.jpg" alt="Michael Brown, Safety Coordinator">
                    <figcaption>
                        <strong>Michael Brown</strong><br>
                        Safety Coordinator
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Whitewater Rafting | Oluwatobi Ojo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
