<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <link rel="stylesheet" href="styles/overlay.css">
</head>

<body>
    <main>
        <h1>CSS Layout: Position Absolute</h1>
        <div class="herodiv">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTl37Ha8cXj2c-sdAN1bfoPl31dXDgypc55Kw&s"
              alt="Placeholder image" width="700" height="300">
            <section class="stats">
                <h2>Nigeria</h2>
                <p>Language: <span id="lan">English</span></p>
                <p>Size: <span id="size">8.5m Km<sup>2</sup></span></p>
                <p>Visited: <span id="visit">No</span></p>
            </section>
        </div>
    </main>
    <footer>Footer Content in Fixed Position with bottom set at 0 pixels </footer>
</body>

</html>
